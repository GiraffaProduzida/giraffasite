name: Deploy para o GitHub Pages

# Roda automaticamente a cada push na branch main, e também pode ser
# disparado manualmente na aba "Actions" do GitHub ("Run workflow").
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações rodando ao mesmo tempo; se um push novo chegar
# enquanto outro deploy está em andamento, o mais recente vence.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build (gera site estático em out/)
        run: npm run build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site estático (pasta out/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
